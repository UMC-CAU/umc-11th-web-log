# 임시 메모리 DB: 서버를 종료하면 데이터가 사라집니다.
spring:
  datasource:
    url: jdbc:h2:mem:umcine;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:demo-schema.sql
      data-locations: classpath:demo-data.sql
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
